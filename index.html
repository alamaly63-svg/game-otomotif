<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Otomotif - Tebak Komponen Motor</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0b1220,#18263d);
  color:#fff;
  min-height:100vh;
}
.app{width:min(760px,100%);margin:auto;padding:18px}
header{text-align:center;padding:12px 0 18px}
.logo{
  display:inline-block;background:#f59e0b;color:#111;padding:7px 13px;
  border-radius:999px;font-weight:900;font-size:12px
}
h1{font-size:30px;margin:12px 0 6px}
.subtitle{color:#cbd5e1;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{
  background:#172338;border:1px solid #30415d;border-radius:16px;
  text-align:center;padding:11px
}
.stat b{display:block;font-size:21px}
.stat span{font-size:11px;color:#94a3b8}
.card{
  background:#162238;border:1px solid #30415d;border-radius:20px;padding:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.18)
}
.progress{
  height:7px;background:#334155;border-radius:99px;overflow:hidden;margin-bottom:18px
}
.progress div{height:100%;width:0;background:#f59e0b;transition:.3s}
.icon{
  height:145px;background:#0d1728;border-radius:16px;display:flex;
  align-items:center;justify-content:center;font-size:70px;margin-bottom:17px
}
.question{font-size:19px;line-height:1.45;font-weight:800;margin-bottom:15px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit}
.answer,.mainBtn{
  min-height:50px;border-radius:13px;border:1px solid #40516b;
  background:#263752;color:#fff;padding:10px 12px;font-weight:800;cursor:pointer
}
.answer:hover{border-color:#f59e0b}
.answer.correct{background:#166534;border-color:#22c55e}
.answer.wrong{background:#991b1b;border-color:#ef4444}
.answer:disabled{cursor:default}
.feedback{min-height:46px;padding:12px 2px 2px;font-size:14px;line-height:1.45;font-weight:700}
.mainBtn{
  width:100%;background:#f59e0b;color:#111827;border:0;margin-top:8px
}
.secondary{background:#22c55e;color:#fff}
.hidden{display:none}
.result{text-align:center}
.result h2{font-size:26px}
.resultScore{
  font-size:56px;font-weight:900;color:#f59e0b;margin:8px 0
}
.resultMessage{color:#cbd5e1;line-height:1.5}
.smallNote{
  color:#94a3b8;font-size:12px;margin-top:14px;text-align:center
}
@media(max-width:560px){
  h1{font-size:24px}
  .answers{grid-template-columns:1fr}
  .icon{height:120px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">GAME EDUKASI OTOMOTIF</div>
  <h1>TEBAK KOMPONEN MOTOR</h1>
  <div class="subtitle">Uji pengetahuan otomotifmu • 10 soal • 100 poin</div>
</header>

<div id="quizArea">
  <div class="stats">
    <div class="stat">
      <b id="score">0</b>
      <span>SKOR</span>
    </div>
    <div class="stat">
      <b id="questionCount">1/10</b>
      <span>SOAL</span>
    </div>
    <div class="stat">
      <b id="time">15</b>
      <span>DETIK</span>
    </div>
  </div>

  <div class="card">
    <div class="progress"><div id="progressBar"></div></div>
    <div class="icon" id="icon">🏍️</div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="smallNote">
    Pilih jawaban yang paling tepat. Posisi jawaban diacak pada setiap permainan.
  </div>
</div>

<div id="resultArea" class="card result hidden">
  <div class="logo">HASIL PERMAINAN</div>
  <h2>SKOR AKHIR</h2>
  <div class="resultScore" id="finalScore">0 POIN</div>
  <div id="finalCount">0/10 SOAL BENAR</div>
  <p class="resultMessage" id="resultMessage"></p>
  <button class="mainBtn secondary" id="shareBtn">📤 BAGIKAN HASIL</button>
  <button class="mainBtn" id="restartBtn">🔄 MAIN LAGI</button>
</div>

</div>

<script>
const questions = [
  {
    icon:"⚙️",
    q:"Komponen yang mengubah gerakan naik-turun piston menjadi gerakan berputar adalah...",
    answers:["Poros engkol (crankshaft)","Camshaft","Rocker arm","Flywheel"],
    correct:"Poros engkol (crankshaft)"
  },
  {
    icon:"🌬️",
    q:"Komponen yang berfungsi menyaring udara sebelum masuk ke mesin adalah...",
    answers:["Fuel pump","Filter udara","Injector","Busi"],
    correct:"Filter udara"
  },
  {
    icon:"⚡",
    q:"Fungsi utama busi pada mesin bensin adalah...",
    answers:["Mengatur tekanan oli","Menyaring bahan bakar","Memercikkan bunga api untuk pembakaran","Mendinginkan radiator"],
    correct:"Memercikkan bunga api untuk pembakaran"
  },
  {
    icon:"🛞",
    q:"Pada rem cakram, komponen yang menjepit kampas ke piringan cakram adalah...",
    answers:["Master cylinder","Caliper","Reservoir","Brake pedal"],
    correct:"Caliper"
  },
  {
    icon:"🔄",
    q:"Pada sistem CVT sepeda motor matic, komponen yang meneruskan putaran dari pulley depan ke pulley belakang adalah...",
    answers:["Rantai","V-belt","Kampas rem","Gear starter"],
    correct:"V-belt"
  },
  {
    icon:"🔋",
    q:"Komponen yang menyimpan energi listrik untuk kebutuhan kelistrikan sepeda motor adalah...",
    answers:["Aki (battery)","Radiator","Injector","Kopling"],
    correct:"Aki (battery)"
  },
  {
    icon:"💧",
    q:"Pada sistem pendingin cairan, komponen yang berfungsi membuang panas dari coolant ke udara adalah...",
    answers:["Radiator","Throttle body","Fuel tank","Air filter"],
    correct:"Radiator"
  },
  {
    icon:"🎛️",
    q:"Pada sepeda motor injeksi, komponen yang mengatur aliran udara masuk berdasarkan bukaan gas adalah...",
    answers:["Throttle body","Oil pump","Regulator/rectifier","Ignition coil"],
    correct:"Throttle body"
  },
  {
    icon:"🛢️",
    q:"Komponen yang menyaring kotoran dari oli mesin sebelum oli bersirkulasi adalah...",
    answers:["Oil filter","Air filter","Fuel injector","Spark plug"],
    correct:"Oil filter"
  },
  {
    icon:"⚙️",
    q:"Komponen yang menghubungkan dan memutus tenaga mesin ke transmisi pada sepeda motor manual adalah...",
    answers:["Kopling","Radiator","Stator","Injector"],
    correct:"Kopling"
  }
];

let current = 0;
let correctCount = 0;
let score = 0;
let timeLeft = 15;
let timer = null;
let answered = false;
let startTime = 0;
let elapsedSeconds = 0;

const scoreEl = document.getElementById("score");
const questionCountEl = document.getElementById("questionCount");
const timeEl = document.getElementById("time");
const progressBar = document.getElementById("progressBar");
const iconEl = document.getElementById("icon");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const feedbackEl = document.getElementById("feedback");
const quizArea = document.getElementById("quizArea");
const resultArea = document.getElementById("resultArea");
const finalScoreEl = document.getElementById("finalScore");
const finalCountEl = document.getElementById("finalCount");
const resultMessageEl = document.getElementById("resultMessage");

function shuffle(array){
  const arr = [...array];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame(){
  current = 0;
  correctCount = 0;
  score = 0;
  elapsedSeconds = 0;
  startTime = Date.now();

  quizArea.classList.remove("hidden");
  resultArea.classList.add("hidden");
  scoreEl.textContent = "0";

  showQuestion();
}

function showQuestion(){
  clearInterval(timer);
  answered = false;
  timeLeft = 15;
  timeEl.textContent = timeLeft;

  const item = questions[current];

  questionCountEl.textContent = `${current + 1}/${questions.length}`;
  progressBar.style.width = `${(current / questions.length) * 100}%`;
  iconEl.textContent = item.icon;
  questionEl.textContent = item.q;
  feedbackEl.textContent = "";

  answersEl.innerHTML = "";

  // KUNCI JAWABAN TIDAK LAGI SELALU A.
  // Jawaban diacak setiap kali soal ditampilkan.
  const shuffledAnswers = shuffle(item.answers);

  shuffledAnswers.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.innerHTML = `<strong>${String.fromCharCode(65 + index)}.</strong> ${answer}`;
    button.addEventListener("click", () => selectAnswer(button, answer, item.correct));
    answersEl.appendChild(button);
  });

  timer = setInterval(() => {
    timeLeft--;
    timeEl.textContent = timeLeft;

    if(timeLeft <= 0){
      clearInterval(timer);
      timeUp();
    }
  }, 1000);
}

function selectAnswer(button, selected, correct){
  if(answered) return;
  answered = true;
  clearInterval(timer);

  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach(btn => btn.disabled = true);

  if(selected === correct){
    button.classList.add("correct");
    correctCount++;
    score = correctCount * 10;
    scoreEl.textContent = score;
    feedbackEl.textContent = "✅ Benar! Jawaban tepat.";
    feedbackEl.style.color = "#4ade80";
  }else{
    button.classList.add("wrong");
    const correctButton = buttons.find(btn => btn.textContent.includes(correct));
    if(correctButton) correctButton.classList.add("correct");
    feedbackEl.textContent = `❌ Kurang tepat. Jawaban benar: ${correct}`;
    feedbackEl.style.color = "#fca5a5";
  }

  setTimeout(nextQuestion, 850);
}

function timeUp(){
  if(answered) return;
  answered = true;

  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach(btn => btn.disabled = true);

  const correct = questions[current].correct;
  const correctButton = buttons.find(btn => btn.textContent.includes(correct));
  if(correctButton) correctButton.classList.add("correct");

  feedbackEl.textContent = `⏰ Waktu habis. Jawaban benar: ${correct}`;
  feedbackEl.style.color = "#fbbf24";

  setTimeout(nextQuestion, 1000);
}

function nextQuestion(){
  current++;

  if(current >= questions.length){
    finishGame();
  }else{
    showQuestion();
  }
}

function finishGame(){
  clearInterval(timer);

  elapsedSeconds = Math.max(1, Math.round((Date.now() - startTime) / 1000));

  quizArea.classList.add("hidden");
  resultArea.classList.remove("hidden");

  progressBar.style.width = "100%";

  finalScoreEl.textContent = `${score} POIN`;
  finalCountEl.textContent = `${correctCount}/${questions.length} SOAL BENAR`;

  if(score === 100){
    resultMessageEl.innerHTML = `🏆 <strong>Sempurna!</strong><br>Semua jawaban benar. Pengetahuan otomotifmu luar biasa!<br><br>Waktu bermain: ${elapsedSeconds} detik`;
  }else if(score >= 80){
    resultMessageEl.innerHTML = `🔥 <strong>Sangat bagus!</strong><br>Pengetahuan otomotifmu sudah sangat baik.<br><br>Waktu bermain: ${elapsedSeconds} detik`;
  }else if(score >= 60){
    resultMessageEl.innerHTML = `👍 <strong>Cukup bagus!</strong><br>Terus latihan agar semakin menguasai komponen motor.<br><br>Waktu bermain: ${elapsedSeconds} detik`;
  }else{
    resultMessageEl.innerHTML = `💪 <strong>Jangan menyerah!</strong><br>Pelajari kembali fungsi komponen motor dan coba lagi.<br><br>Waktu bermain: ${elapsedSeconds} detik`;
  }
}

document.getElementById("restartBtn").addEventListener("click", startGame);

document.getElementById("shareBtn").addEventListener("click", async () => {
  const shareText = `Saya mendapat ${score} POIN (${correctCount}/10 benar) di Game Tebak Komponen Motor! Coba kalahkan skor saya!`;

  if(navigator.share){
    try{
      await navigator.share({
        title:"Challenge Otomotif",
        text:shareText,
        url:window.location.href
      });
    }catch(e){}
  }else{
    try{
      await navigator.clipboard.writeText(`${shareText}\n${window.location.href}`);
      alert("Hasil permainan dan link sudah disalin. Silakan tempel di Facebook.");
    }catch(e){
      prompt("Salin teks berikut:", `${shareText}\n${window.location.href}`);
    }
  }
});

startGame();
</script>
</body>
</html>
